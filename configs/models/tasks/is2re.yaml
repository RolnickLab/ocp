default:
  trainer: single
  logger: wandb

  task:
    dataset: single_point_lmdb
    description: "Relaxed state energy prediction from initial structure OC22."
    type: regression
    metric: mae
    labels:
      - relaxed energy
  optim:
    optimizer: AdamW
  normalizer: null
  model:
    otf_graph: False
    max_num_neighbors: 40
  mode: train
  adsorbates: all   # {"*O", "*OH", "*OH2", "*H"}
  adsorbates_ref_dir: /network/scratch/s/schmidtv/ocp/datasets/ocp/per_ads
  load_datasets: True
  dataset:
    default_val: val_id
    train:
      src: /network/projects/crystalgfn/catalyst/ocp/oc22/train/
      normalize_labels: True
      target_mean:  0.38994525473291336 # -1.525913953781128
      target_std: 2.524972595834097 # 2.279365062713623
    val_id:
      src: /network/projects/crystalgfn/catalyst/ocp/oc22/val_id/
    val_ood_cat:
      src: /network/projects/crystalgfn/catalyst/ocp/oc22/val_ood/
    val_ood_ads:
      src: /network/projects/crystalgfn/catalyst/ocp/oc22/val_ood/
    val_ood_both:
      src: /network/projects/crystalgfn/catalyst/ocp/oc22/val_ood/
  # DEUP
  deup_dataset:
    create: False # "before" -> created before training (for deup) "after" -> created after training (for is2re) "" - not created
    dataset_strs: ["train", "val_id", "val_ood_cat", "val_ood_ads"]
    n_samples: 7

10k:
  dataset:
    train:
      src: /network/scratch/s/schmidtv/ocp/datasets/ocp/is2re/10k/train

100k:
  dataset:
    train:
      src: /network/scratch/s/schmidtv/ocp/datasets/ocp/is2re/100k/train

all: {}