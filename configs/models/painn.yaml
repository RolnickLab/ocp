default:
  model:
    name: painn
    use_pbc: True

# -------------------
# -----  IS2RE  -----
# -------------------

is2re:
  10k: {}
  100k: {}
  all: {}

# ------------------
# -----  S2EF  -----
# ------------------

s2ef:
  default: {}
  200k: {}
  2M:
    model:
      name: painn
      hidden_channels: 512
      num_layers: 6
      num_rbf: 128
      cutoff: 12.0
      max_neighbors: 50
      # scale_file: configs/s2ef/all/painn/painn_nb6_scaling_factors.pt
      regress_forces: True
      direct_forces: True
      use_pbc: True

    optim:
      batch_size: 32
      eval_batch_size: 32
      load_balancing: atoms
      eval_every: 5000
      num_workers: 2
      optimizer: AdamW
      optimizer_params:
        amsgrad: True
        weight_decay: 0.  # 2e-6 (TF weight decay) / 1e-4 (lr) = 2e-2
      lr_initial: 1.e-4
      lr_gamma: 0.8
      scheduler: ReduceLROnPlateau
      mode: min
      factor: 0.8
      patience: 3
      max_epochs: 80
      force_coefficient: 100
      energy_coefficient: 1
      ema_decay: 0.999
      clip_grad_norm: 10

  20M: {}
  all: {}

qm9:
  default:
    model:
        num_atoms: null # useless
        bond_feat_dim: null # useless
        num_targets: null # useless
        hidden_channels: 512
        num_layers: 6
        num_rbf: 128
        cutoff: 12.0
        max_neighbors: 50
        rbf: {"name": "gaussian"}
        envelope: {"name": "polynomial", "exponent": 5}
        regress_forces: False
        direct_forces: True
        use_pbc: False
        otf_graph: False
        num_elements: 83
    optim:
      batch_size: 100
      num_workers: 4
      lr_initial: 0.001
      max_epochs: 1000
      decay_steps: 125000
      decay_rate: 0.01
      ema_decay: 0.999
      # all below is for the scheduler
      scheduler: ReduceLROnPlateau
      mode: min
      factor: 0.95
      threshold: 0.0001
      threshold_mode: abs
      min_lr: 0.000001
      verbose: true
      patience: 10

  10k: {}
  all: {}

qm7x:
  default: {}
  all: {}
  1k: {}


